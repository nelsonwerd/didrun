[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "didrun"
version = "0.1.0"
description = "Flight records for agent-written code: deterministic session capture, evidence ledger, and graded verification."
requires-python = ">=3.11"
license = "Apache-2.0"
readme = "README.md"
authors = [{ name = "didrun contributors" }]
keywords = ["ai-agents", "provenance", "verification", "git", "evidence"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Operating System :: POSIX :: Linux",
    "Operating System :: MacOS",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Quality Assurance",
    "Topic :: Software Development :: Testing",
    "Topic :: Utilities",
]
# NO runtime dependencies. Stdlib-only is a hard invariant (auditability is the trust wedge).
dependencies = []

[project.urls]
Homepage = "https://github.com/nelsonwerd/didrun"
Repository = "https://github.com/nelsonwerd/didrun"
Issues = "https://github.com/nelsonwerd/didrun/issues"

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
didrun = "didrun.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
